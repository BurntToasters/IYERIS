name: CI

on:
  push:
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.16.0'
  NPM_VERSION: '12'
  RUST_VERSION: 'stable'
  CARGO_AUDIT_VERSION: '0.22.2'

jobs:
  verify:
    name: Test + Format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-targets: false
          prefix-key: v2-${{ matrix.os }}
          key: ${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Typecheck (app + tests)
        run: |
          npm run typecheck
          npm run typecheck:test

      - name: Lint
        # lint:prod is app source with --max-warnings 0 (strict). Test files
        # use innerHTML with static fixtures, which trips the XSS guard rule;
        # those are reviewed and intentionally excluded from the strict gate.
        run: npm run lint:prod

      - name: Clippy
        # -D warnings fails on any clippy lint or rustc warning, except the
        # deliberate unsafe_code markers (crate sets unsafe_code = "warn" to
        # self-document justified FFI/env blocks; those should not fail CI).
        run: cargo clippy --locked --all-targets -- -D warnings -A unsafe_code
        working-directory: src-tauri

      - name: Run test suite and formatting checks
        run: npm run test:all

      - name: Build frontend
        run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-targets: false
          prefix-key: v2-audit

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: npm audit (production deps)
        run: npm audit --production --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked

      - name: cargo audit
        run: cargo audit
        working-directory: src-tauri
