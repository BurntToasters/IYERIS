[package]
name = "iyeris-e2e"
description = "End-to-end harness for iyeris-core. Writes target/e2e/core-artifact.json."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
iyeris-core = { path = "../iyeris-core" }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
